<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADHD Depoet – øvingsrom for foreldre</title>
    <meta name="description" content="Et digitalt øvingsrom for foreldre som vil forstå ADHD og reguleringsvansker bedre – og finne måter å møte barnet og hverdagen på som passer for deres familie. Bygget på boken Førersetet." />
    <link rel="icon" type="image/png" href="/depoet-logo-thumb-transparent.png" />
    <link rel="apple-touch-icon" href="/depoet-logo-thumb-transparent.png" />
    <meta property="og:title" content="ADHD Depoet – øvingsrom for foreldre" />
    <meta property="og:description" content="Forstå ADHD og reguleringsvansker bedre – og finn måter å møte barnet og hverdagen på som passer for deres familie. Bygget på boken Førersetet." />
    <meta property="og:image" content="https://adhd-depoet.com/depoet-logo-transparent.png" />
    <meta property="og:url" content="https://adhd-depoet.com" />
    <meta property="og:type" content="website" />
    <script>
      // No-flash mørk modus: sett .dark før render ut fra lagret valg / systempreferanse
      (function () {
        try {
          var p = localStorage.getItem('depoet_theme') || 'system';
          var dark = p === 'dark' || (p === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
